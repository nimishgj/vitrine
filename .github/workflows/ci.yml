name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test ./...

  integration-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go test -tags integration ./internal/sandbox/linux/ -v
      - name: doctor end to end
        run: |
          go build -o /tmp/vitrine ./cmd/vitrine
          /tmp/vitrine init
          /tmp/vitrine doctor

  integration-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: build and init
        run: |
          go build -o /usr/local/bin/vitrine ./cmd/vitrine
          sudo /usr/local/bin/vitrine init
      - run: sudo go test -tags integration ./internal/sysuser/ -v
      - run: go test -tags integration ./internal/sandbox/darwin/ ./internal/grants/ -v
      - name: doctor end to end
        run: vitrine doctor
